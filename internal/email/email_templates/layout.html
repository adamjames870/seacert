<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>{{.Title}}</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f4f5f7;
    font-family:Arial,Helvetica,sans-serif;
    color:#1f2937;
">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0"
       style="background:#f4f5f7;padding:32px 16px;">
    <tr>
        <td align="center">

            <table role="presentation"
                   width="100%"
                   cellspacing="0"
                   cellpadding="0"
                   style="
                       max-width:600px;
                       background:#ffffff;
                       border-radius:8px;
                       overflow:hidden;
                   ">

                <tr>
                    <td style="
                        padding:24px 32px;
                        background:#0f172a;
                        color:#ffffff;
                        font-size:24px;
                        font-weight:bold;
                    ">
                        SeaCert
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px;">

                        <h1 style="
                            margin:0 0 20px;
                            font-size:24px;
                            line-height:1.3;
                        ">
                            {{.Heading}}
                        </h1>

                        <p style="
                            margin:0 0 24px;
                            font-size:16px;
                            line-height:1.6;
                        ">
                            {{.Message}}
                        </p>

                        {{if .CTAURL}}
                        <table role="presentation" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="
                                    background:#2563eb;
                                    border-radius:6px;
                                ">
                                    <a href="{{.CTAURL}}"
                                       style="
                                           display:inline-block;
                                           padding:12px 20px;
                                           color:#ffffff;
                                           text-decoration:none;
                                           font-weight:bold;
                                       ">
                                        {{.CTA}}
                                    </a>
                                </td>
                            </tr>
                        </table>
                        {{end}}

                    </td>
                </tr>

                <tr>
                    <td style="
                        padding:20px 32px;
                        border-top:1px solid #e5e7eb;
                        font-size:12px;
                        color:#6b7280;
                        line-height:1.5;
                    ">
                        SeaCert<br>
                        Keep your maritime certification organised and up to date.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
