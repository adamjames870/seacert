{{define "content"}}

<h1
        style="
        margin: 0 0 20px 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
        color: #111827;
    "
>
    Email delivery is working
</h1>

<p style="margin: 0 0 16px 0;">
    Hello {{.FirstName}},
</p>

<p style="margin: 0 0 24px 0;">
    This is a test email sent from the SeaCert API.
    If you've received this message, outbound email delivery is
    configured correctly.
</p>

<table
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
>
    <tr>
        <td
                style="
                background-color: #2563eb;
                border-radius: 6px;
            "
        >
            <a
                    href="{{.AppURL}}"
                    style="
                    display: inline-block;
                    padding: 12px 20px;
                    font-size: 15px;
                    font-weight: 600;
                    color: #ffffff;
                    text-decoration: none;
                "
            >
                Open SeaCert
            </a>
        </td>
    </tr>
</table>

{{end}}
